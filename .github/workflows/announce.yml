name: announce

on:
  push:
    branches: [main]
    paths: ['feed.xml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install tweepy

      - name: Post latest night to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/announce_x.py

      - name: Save announce state
        run: |
          git config user.name "mimei-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .announce_state 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "announce: mark latest night as posted" && git push)
