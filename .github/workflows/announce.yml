name: announce

on:
  push:
    branches: [main]
    paths: ['feed.xml']
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Resolve site URL (Pages API — 独自ドメインにも自動追従)
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh api "repos/${{ github.repository }}/pages" --jq '.html_url' 2>/dev/null || true)
          if [ -z "$URL" ]; then
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          echo "base=$URL" >> "$GITHUB_OUTPUT"
          echo "site base: $URL"

      - name: Post latest night to Bluesky
        env:
          SITE_BASE: ${{ steps.site.outputs.base }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python scripts/announce_bsky.py

      - name: Save announce state
        run: |
          git config user.name "mimei-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .announce_state 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "announce: mark latest night as posted" && git push)
