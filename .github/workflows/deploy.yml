name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Bake real URL into files
        run: |
          BASE="${{ steps.pages.outputs.base_url }}"
          BASE_NOSCHEME="${BASE#https://}"
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.xml" -o -name "robots.txt" \) \
            -exec sed -i "s|https://YOURNAME.github.io/mimei|${BASE}|g; s|YOURNAME.github.io/mimei|${BASE_NOSCHEME}|g" {} +

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
