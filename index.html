<style>

button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}

input,select{font-family:var(--gothic);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:9px 10px;font-size:14px;width:100%}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.ticket{border:1px solid rgba(185,152,90,.4);padding:16px 18px 14px;position:relative}
.tate{position:absolute;top:14px;right:14px;writing-mode:vertical-rl;font-family:var(--mincho);font-size:13px;letter-spacing:.45em;color:var(--kin)}
.eyebrow{font-size:10px;letter-spacing:.4em;color:var(--dim)}
.title{font-family:var(--mincho);font-weight:800;font-size:29px;margin:10px 0 8px;letter-spacing:.06em;line-height:1.3}

.perf{border-bottom:1px dashed rgba(185,152,90,.33);margin:0 6px}
.gear{position:absolute;bottom:10px;right:14px;font-size:10px;letter-spacing:.25em;color:var(--dim);padding:4px 2px}
.gear:hover{color:var(--kin)}

main{max-width:540px;margin:0 auto;padding:20px 22px 116px;animation:fade .4s ease}

nav{position:fixed;bottom:0;left:0;right:0;background:rgba(19,26,56,.96);backdrop-filter:blur(8px);border-top:1px solid rgba(185,152,90,.27);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:540px;margin:0 auto;display:flex}
.navbtn{flex:1;padding:14px 0 16px;font-family:var(--mincho);font-size:14px;letter-spacing:.18em;color:var(--dim);position:relative}
.navbtn.on{color:var(--ink)}
.navbtn.on::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--shu)}

const SHOTS = [
  {id:"s1",phase:"発つ前",label:"宿を出る前の支度と、ひとこと"},
  {id:"s2",phase:"道中",label:"車窓 — スタジアムが見えた瞬間の顔"},

// ---------- 状態 ----------
let state = { done:{}, custom:{bag:[],film:[]}, settings:{...DEFAULT_SETTINGS} };
let tab = "match";
let openPhrase = null;
let settingsOpen = false;

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      state.done = s.done || {};
      state.custom = Object.assign({bag:[],film:[]}, s.custom);
      state.settings = Object.assign({}, DEFAULT_SETTINGS, s.settings);
    }
  }catch(e){ /* 壊れていたら初期値で続行 */ }
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

// ---------- 漢数字・日時 ----------
const KD = ["〇","一","二","三","四","五","六","七","八","九"];
function numK(n){ // 0-99
  if(n<10) return KD[n];
  const t=Math.floor(n/10), o=n%10;
  return (t===1?"":KD[t])+"十"+(o===0?"":KD[o]);
}
function yearK(y){ return String(y).split("").map(d=>KD[+d]).join(""); }
function hourK(h,m){
  const min = m===0?"":(m===30?"半":numK(m)+"分");
  if(h===0) return "午前零時"+min;
  if(h===12) return min?"午後零時"+min:"正午";
  return (h<12?"午前"+numK(h):"午後"+numK(h-12))+"時"+min;
}

// 任意タイムゾーンの「壁時計時刻」をUTCのDateに変換
function zonedDate(naiveISO, tz){
  const guess = new Date(naiveISO+":00Z");
  const dtf = new Intl.DateTimeFormat("en-US",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  const p = {};
  dtf.formatToParts(guess).forEach(x=>p[x.type]=x.value);
  const asTz = Date.UTC(+p.year, +p.month-1, +p.day, +p.hour%24, +p.minute, +p.second);
  return new Date(guess.getTime() - (asTz - guess.getTime()));
}
function partsIn(date, tz){
  const dtf = new Intl.DateTimeFormat("ja-JP",{timeZone:tz,year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",weekday:"short",hour12:false});
  const p={};
  dtf.formatToParts(date).forEach(x=>p[x.type]=x.value);
  return {y:+p.year,mo:+p.month,d:+p.day,h:+p.hour%24,mi:+p.minute,w:p.weekday};
}
function kanjiDateTime(date, tz){
  const p = partsIn(date, tz);
  return `${yearK(p.y)}年${numK(p.mo)}月${numK(p.d)}日(${p.w})${hourK(p.h,p.mi)}`;
}
function kanjiDateTimeShort(date, tz){
  const p = partsIn(date, tz);
  return `${numK(p.mo)}月${numK(p.d)}日(${p.w})${hourK(p.h,p.mi)}`;
}
function kickoffDate(){ return zonedDate(state.settings.kickoff, state.settings.tz); }
const pad2 = n => String(n).padStart(2,"0");
const zTime = (d,tz)=> new Intl.DateTimeFormat("ja-JP",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
const zDay = (d,tz)=> new Intl.DateTimeFormat("ja-JP",{timeZone:tz,month:"numeric",day:"numeric",weekday:"short"}).format(d);
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function isDefaultMatch(){
  const s=state.settings, d=DEFAULT_SETTINGS;
  return s.home===d.home && s.away===d.away && s.kickoff===d.kickoff && s.venue===d.venue;
}

// ---------- 描画 ----------
const TABS = [
  {id:"match",label:"試合"},{id:"day",label:"当日"},{id:"bag",label:"支度"},
  {id:"talk",label:"言葉"},{id:"film",label:"記録"},{id:"safe",label:"備え"},

  document.getElementById("hMeta").innerHTML =
    `${esc(kanjiDateTime(kickoffDate(), s.tz))} 蹴球開始<br>於 ${esc(s.venue)} ${esc(s.city)}`;
}

function renderNav(){
  document.getElementById("navin").innerHTML = TABS.map(t=>
    `<button class="navbtn${t.id===tab?" on":""}" data-tab="${t.id}">${t.label}</button>`

}

function listHTML(items, kind){
  const heads = {
    timeline:{title:"当日の運び",sub:"蹴球開始から逆算した一日の手本。済んだら印を。時刻は十五時開始の例。"},
    bag:{title:"支度",sub:"前夜のうちにすべて印を。鞄はクリアバッグの定めに従う。"},
    film:{title:"記録の手控え",sub:"撮るべき場面の覚え書き。ただし試合中は、まず目で観る。"},
  };
  const customKey = kind==="bag"?"bag":(kind==="film"?"film":null);
  const customs = customKey ? state.custom[customKey].map((c,i)=>({id:`x-${customKey}-${i}`,cat:"自分の覚え",phase:"自分の覚え",label:c,custom:true,ci:i})) : [];
  const all = items.concat(customs);
  const doneCount = all.filter(i=>state.done[i.id]).length;
  const h = heads[kind];

  let html = `<div class="head"><div class="top"><h2>${h.title}</h2><span class="prog">${doneCount} / ${all.length}</span></div><p>${h.sub}</p></div>`;
  let last = null;
  for(const item of all){
    const group = item.cat || item.phase || null;
    if(group && group!==last){ html += `<div class="grp">${esc(group)}</div>`; last = group; }
    const done = !!state.done[item.id];
    const mark = `<span class="mark" aria-hidden="true">${done?"済":""}</span>`;
    html += `<button class="item${done?" done":""}" data-toggle="${item.id}">`;
    if(item.time) html += `<span class="time">${esc(item.time)}</span>`;
    else html += mark;
    html += `<span class="body"><span class="lbl">${esc(item.title||item.label)}</span>`;
    if(item.note) html += `<span class="note">${esc(item.note)}</span>`;
    html += `</span>`;
    if(item.time) html += mark;
    if(item.custom) html += `<span class="del" data-del="${customKey}:${item.ci}" role="button" aria-label="削除">×</span>`;
    html += `</button>`;
  }
  if(customKey){
    html += `<div class="addrow"><input id="addInput" placeholder="自分の項目を書き足す" maxlength="60"><button data-add="${customKey}">追 加</button></div>`;
  }
  return html;
}

function render(){
  renderHeader();
  renderNav();
  const main = document.getElementById("main");
  if(tab==="match") main.innerHTML = matchHTML();
  else if(tab==="day") main.innerHTML = listHTML(TIMELINE,"timeline");
  else if(tab==="bag") main.innerHTML = listHTML(CHECKLIST,"bag");
  else if(tab==="talk") main.innerHTML = talkHTML();
  else if(tab==="film") main.innerHTML = listHTML(SHOTS,"film");
  else if(tab==="safe") main.innerHTML = safeHTML();
  renderModals();
  tick();
}

function renderModals(){
  const m = document.getElementById("modals");
  let html = "";
  if(openPhrase){
    const p = PHRASES.find(x=>x.id===openPhrase);
    if(p) html += `<div class="overlay" id="phraseOverlay" role="button" tabindex="0">
      <div class="cap">この画面を見せる</div>
      <div class="big">${esc(p.en)}</div>
      <div class="sub">${esc(p.ja)}</div>
      <div class="close">触れると閉じる</div></div>`;
  }
  if(settingsOpen) html += settingsHTML();
  m.innerHTML = html;
}

// ---------- 時計 ----------
function tick(){
  const now = new Date();
  const ko = kickoffDate();
  const cdEl = document.getElementById("cd");
  if(cdEl){
    const diff = ko - now;
    const abs = Math.abs(diff);
    const dd = Math.floor(abs/86400000), hh=Math.floor(abs%86400000/3600000),
          mm=Math.floor(abs%3600000/60000), ss=Math.floor(abs%60000/1000);
    document.getElementById("cdLabel").textContent = diff<=0?"蹴球開始から":"蹴球開始まで";
    cdEl.innerHTML = (dd>0?`${dd}<span class="u">日</span>`:"")+
      `${pad2(hh)}<span class="u">時</span>${pad2(mm)}<span class="u">分</span>${pad2(ss)}<span class="u">秒</span>`;
    const tz = state.settings.tz;
    document.getElementById("clkA").textContent = zTime(now,tz);
    document.getElementById("clkAd").textContent = zDay(now,tz);
    document.getElementById("clkB").textContent = zTime(now,"Asia/Tokyo");
    document.getElementById("clkBd").textContent = zDay(now,"Asia/Tokyo");
  }
}
setInterval(tick, 1000);

// ---------- 操作 ----------
document.addEventListener("click", (e)=>{
  const del = e.target.closest("[data-del]");
  if(del){
    e.stopPropagation();
    const [key,i] = del.dataset.del.split(":");
    state.custom[key].splice(+i,1);
    // 添字ずれ防止のため当該キーの印を整理
    Object.keys(state.done).forEach(k=>{ if(k.startsWith(`x-${key}-`)) delete state.done[k]; });
    save(); render(); return;
  }
  const t = e.target.closest("[data-tab]");
  if(t){ tab = t.dataset.tab; render(); return; }
  const tg = e.target.closest("[data-toggle]");
  if(tg){ const id=tg.dataset.toggle; state.done[id]=!state.done[id]; if(!state.done[id]) delete state.done[id]; save(); render(); return; }
  const ph = e.target.closest("[data-phrase]");
  if(ph){ openPhrase = ph.dataset.phrase; renderModals(); return; }
  if(e.target.closest("#phraseOverlay")){ openPhrase=null; renderModals(); return; }
  const add = e.target.closest("[data-add]");
  if(add){
    const input = document.getElementById("addInput");
    const v = (input.value||"").trim();
    if(v){ state.custom[add.dataset.add].push(v); save(); render(); }
    return;
  }
  if(e.target.closest("#gearBtn")){ settingsOpen=true; renderModals(); return; }
  if(e.target.closest("#settingsCancel")){ settingsOpen=false; renderModals(); return; }
  if(e.target.closest("#settingsSave")){
    const g = id=>document.getElementById(id).value.trim();
    state.settings = {
      label:g("fLabel")||DEFAULT_SETTINGS.label,
      home:g("fHome")||"自分の側", away:g("fAway")||"相手",
      kickoff:document.getElementById("fKickoff").value||DEFAULT_SETTINGS.kickoff,
      tz:document.getElementById("fTz").value,
      venue:g("fVenue")||"会場", city:g("fCity")||"",
    };
    settingsOpen=false; save(); render(); return;
  }
  if(e.target.closest("#clearMarks")){
    if(confirm("すべての印を消します。よろしいですか。")){ state.done={}; save(); render(); }
    return;
  }
  if(e.target.closest("#resetAll")){
    if(confirm("設定・印・書き足した項目をすべて消して、最初の状態に戻します。よろしいですか。")){
      state = {done:{},custom:{bag:[],film:[]},settings:{...DEFAULT_SETTINGS}};
      save(); settingsOpen=false; render();
    }
    return;
  }
});

// ---------- 起動 ----------
load();
render();
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
</script>
